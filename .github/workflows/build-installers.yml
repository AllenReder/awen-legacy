# One definition for every artifact the release publishes. `ci.yml` and
# `release.yml` both call this workflow, so a tag publishes what `main` and
# packaging-changing pull requests already built. The Apple credential check
# lives here instead of in the callers: runs without secrets build ad-hoc DMGs,
# while a release that has Developer ID secrets notarizes.
name: Build release installers

on:
  workflow_call:
    inputs:
      artifact-retention-days:
        description: Days to keep the uploaded installers.
        type: number
        default: 7
    secrets:
      APPLE_CERTIFICATE:
        description: Base64-encoded Developer ID Application certificate.
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        description: Password for the Developer ID certificate.
        required: false
      KEYCHAIN_PASSWORD:
        description: Password for the temporary build keychain.
        required: false
      APPLE_ID:
        description: Apple ID used for notarization.
        required: false
      APPLE_PASSWORD:
        description: App-specific password for the Apple ID.
        required: false
      APPLE_TEAM_ID:
        description: Apple Developer team ID used for notarization.
        required: false

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve the product version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - name: Read the product version
        id: version
        run: |
          set -euo pipefail
          node scripts/version.ts check
          version="$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version)')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  daemon-linux-x64:
    name: Linux x64 daemon
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4.3.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Build Linux x64 daemon package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/build-server-package.ts --platform linux --arch x64 --version "$VERSION"
      - name: Verify checksum and smoke-test the daemon
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          cd release-server
          archive="awen-server-$VERSION-linux-x64.tar.gz"
          sha256sum -c SHA256SUMS
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          stem="awen-server-$VERSION-linux-x64"
          tar -xzf "$archive" -C "$scratch"
          awen="$scratch/$stem/bin/awen"
          test "$("$awen" --version)" = "awen v$VERSION"
          export AWEN_HOME="$scratch/awen-home"
          export AWEN_NO_BROWSER=1
          "$awen" daemon start --json
          "$awen" daemon status --json
          "$awen" daemon stop --confirm --json
          mkdir -p "$GITHUB_WORKSPACE/release-assets"
          cp "$archive" "$GITHUB_WORKSPACE/release-assets/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daemon-linux-x64
          path: release-assets/*
          if-no-files-found: error
          retention-days: ${{ inputs.artifact-retention-days }}

  desktop-macos:
    name: macOS ${{ matrix.arch }} desktop
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            macho: arm64
          - runner: macos-15-intel
            arch: x64
            macho: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4.3.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Configure macOS signing
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$APPLE_CERTIFICATE" && -z "$APPLE_CERTIFICATE_PASSWORD" && -z "$KEYCHAIN_PASSWORD" && -z "$APPLE_ID" && -z "$APPLE_PASSWORD" && -z "$APPLE_TEAM_ID" ]]; then
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "CSC_FOR_PULL_REQUEST=true" >> "$GITHUB_ENV"
            echo "mode=adhoc" >> "$GITHUB_OUTPUT"
            echo "Building an ad-hoc signed DMG; users must approve it in Privacy & Security."
            exit 0
          fi
          if [[ -z "$APPLE_CERTIFICATE" || -z "$APPLE_CERTIFICATE_PASSWORD" || -z "$KEYCHAIN_PASSWORD" || -z "$APPLE_ID" || -z "$APPLE_PASSWORD" || -z "$APPLE_TEAM_ID" ]]; then
            echo "Provide all macOS signing and notarization secrets, or none for ad-hoc signing." >&2
            exit 1
          fi
          certificate="$RUNNER_TEMP/awen-developer-id.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          keychain="$RUNNER_TEMP/awen-build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security default-keychain -s "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -t 3600 -u "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -n 1)"
          if [[ -z "$identity" ]]; then
            echo "The imported certificate is not a Developer ID Application identity." >&2
            exit 1
          fi
          echo "CSC_FOR_PULL_REQUEST=true" >> "$GITHUB_ENV"
          echo "CSC_NAME=$identity" >> "$GITHUB_ENV"
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
          echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_PASSWORD" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
          echo "mode=developer-id" >> "$GITHUB_OUTPUT"
      # A warm cache turns the Node download into a checksum check. The primary
      # key follows `package.json` (so an `engines.node` bump misses it) and the
      # restore key still hands over the previous archive, which the script
      # re-verifies before reusing.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/awen-node-runtime
          key: node-runtime-macos-${{ matrix.arch }}-${{ hashFiles('package.json') }}
          restore-keys: node-runtime-macos-${{ matrix.arch }}-
      - name: Stage desktop daemon and Node runtime
        env:
          AWEN_NODE_RUNTIME_CACHE: ${{ runner.temp }}/awen-node-runtime
        run: node scripts/stage-desktop-runtime.ts --platform darwin --arch "${{ matrix.arch }}"
      # Staging runs the root `pnpm build`, so `apps/web/dist` is already
      # fresh here; rebuilding it added a second full web build to every
      # installer job.
      - name: Compile desktop bundle
        run: pnpm --filter @awen/desktop build:bundle
      - name: Build desktop installer
        env:
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          if [[ "$SIGNING_MODE" == "adhoc" ]]; then
            pnpm --filter @awen/desktop exec electron-builder --mac dmg --${{ matrix.arch }} --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false
          else
            pnpm --filter @awen/desktop exec electron-builder --mac dmg --${{ matrix.arch }} --publish never -c.forceCodeSigning=true
          fi
      - name: Collect macOS installer
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
          MACHO_ARCH: ${{ matrix.macho }}
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: bash scripts/release/collect-macos.sh
      - name: Smoke-test the packaged daemon
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: bash scripts/release/verify-macos.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-macos-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: ${{ inputs.artifact-retention-days }}

  desktop-windows-x64:
    name: Windows x64 desktop
    needs: [prepare, daemon-linux-x64]
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4.3.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/awen-node-runtime
          key: node-runtime-windows-x64-${{ hashFiles('package.json') }}
          restore-keys: node-runtime-windows-x64-
      - name: Stage desktop daemon and Node runtime
        env:
          AWEN_NODE_RUNTIME_CACHE: ${{ runner.temp }}/awen-node-runtime
        run: node scripts/stage-desktop-runtime.ts --platform win32 --arch x64
      # Staging runs the root `pnpm build`, so `apps/web/dist` is already
      # fresh here; rebuilding it added a second full web build to every
      # installer job.
      - name: Compile desktop bundle
        run: pnpm --filter @awen/desktop build:bundle
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: daemon-linux-x64
          path: wsl-runtime-artifact
      - name: Stage WSL daemon archive
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $archive = "wsl-runtime-artifact/awen-server-$env:VERSION-linux-x64.tar.gz"
          Copy-Item $archive "apps/desktop/wsl-runtime.tar.gz"
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $pwd "apps/desktop/wsl-runtime.tar.gz.sha256"), "$hash`n")
      - name: Build Windows installer
        run: pnpm --filter @awen/desktop exec electron-builder --win nsis --x64 --publish never
      - name: Collect unsigned Windows installers
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: pwsh -File scripts/release/collect-windows.ps1
      - name: Smoke-test the packaged daemon
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: pwsh -File scripts/release/verify-windows.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-windows-x64
          path: release-assets/*
          if-no-files-found: error
          retention-days: ${{ inputs.artifact-retention-days }}

  assemble:
    name: Verify final release assets
    needs: [prepare, daemon-linux-x64, desktop-macos, desktop-windows-x64]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-*"
          path: release-assets
          merge-multiple: true
      - name: Assemble and verify the exact published inventory
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/release/assets.mjs assemble release-assets "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: ${{ inputs.artifact-retention-days }}
