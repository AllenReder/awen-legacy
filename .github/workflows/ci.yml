# Pull request and `main` gate. The installer jobs live in
# `build-installers.yml`, the same workflow `release.yml` calls, so a pull
# request exercises the macOS and Windows packaging steps a release runs; the
# `ci gate` job is the single status check branch protection needs.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - run: node scripts/version.ts check
      - run: pnpm fmt:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build

  tests:
    # `apps/server` and `apps/web` hold most of the suite and used to run one
    # after the other; `--shard` splits each of them across two runners and
    # `test:packages` covers every other workspace package. A shard with no
    # test file fails, so a package that silently loses its tests cannot pass.
    name: Tests (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server 1/2
            command: pnpm test:server --shard=1/2
          - name: server 2/2
            command: pnpm test:server --shard=2/2
          - name: web 1/2
            command: pnpm test:web --shard=1/2
          - name: web 2/2
            command: pnpm test:web --shard=2/2
          - name: workspace packages
            command: pnpm test:packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - run: ${{ matrix.command }}

  desktop-shell:
    name: Compile desktop shell
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Ensure Electron runtime
        run: pnpm --filter @awen/desktop ensure:electron
      - name: Compile the desktop shell
        run: vp run --filter @awen/desktop build
      - name: Verify preload bundle
        run: node apps/desktop/scripts/verify-preload-bundle.mjs
      - name: Typecheck the desktop shell
        run: pnpm --filter @awen/desktop typecheck
      - name: Test the desktop shell
        run: pnpm --filter @awen/desktop test
      - name: Desktop smoke test
        run: pnpm --filter @awen/desktop smoke-test

  installers:
    name: Release installers
    uses: ./.github/workflows/build-installers.yml
    with:
      artifact-retention-days: 3
    secrets: inherit

  gate:
    name: CI gate
    if: always()
    needs: [quality, tests, desktop-shell, installers]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every upstream job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Upstream job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "An upstream job did not succeed: $result" >&2
                exit 1
                ;;
            esac
          done
