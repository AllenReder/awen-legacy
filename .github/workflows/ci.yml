# Pull request and `main` gate. `build-installers.yml` owns every packaging
# step and `release.yml` calls the same workflow, so the installers a release
# publishes come from one definition. An ordinary pull request runs `quality`,
# `tests` and the Linux `desktop-shell` smoke; the four-target installer matrix
# runs on `main`, on every tag and on pull requests that change a packaging
# input. `ci gate` is the single status check branch protection needs.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # A pull request only gets the installer matrix when it changes a file that
    # can change how the installers are built. The list lives in
    # `scripts/packaging-inputs.ts` so the workflow and its tests agree on it.
    name: Detect packaging inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      packaging: ${{ steps.detect.outputs.packaging }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect packaging inputs
        id: detect
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            echo "packaging=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "${BASE_REF}"
          packaging="$(git diff --name-only "origin/${BASE_REF}...HEAD" | node scripts/packaging-inputs.ts)"
          echo "packaging=$packaging" >> "$GITHUB_OUTPUT"

  quality:
    name: Typecheck, lint, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - run: node scripts/version.ts check
      - run: pnpm fmt:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build

  tests:
    # `apps/server` and `apps/web` hold most of the suite and used to run one
    # after the other; `--shard` splits each of them across two runners and
    # `test:packages` covers every other workspace package. A shard with no
    # test file fails, so a package that silently loses its tests cannot pass.
    name: Tests (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server 1/2
            command: pnpm test:server --shard=1/2
          - name: server 2/2
            command: pnpm test:server --shard=2/2
          - name: web 1/2
            command: pnpm test:web --shard=1/2
          - name: web 2/2
            command: pnpm test:web --shard=2/2
          - name: workspace packages
            command: pnpm test:packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - run: ${{ matrix.command }}

  desktop-shell:
    name: Compile desktop shell
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          cache: true
      - name: Install Linux desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config xvfb libsecret-1-dev libgtk-3-0 libnss3 libasound2t64
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Ensure Electron runtime
        run: pnpm --filter @awen/desktop ensure:electron
      - name: Compile the desktop shell
        run: pnpm exec vp run --filter @awen/desktop build
      - name: Verify preload bundle
        run: node apps/desktop/scripts/verify-preload-bundle.mjs
      - name: Typecheck the desktop shell
        run: pnpm --filter @awen/desktop typecheck
      - name: Test the desktop shell
        run: pnpm --filter @awen/desktop test
      - name: Build daemon, client and Linux cookie helper
        run: |
          pnpm build
          node apps/desktop/scripts/build-browser-secret.mjs
      - name: Desktop smoke test
        run: xvfb-run -a pnpm --filter @awen/desktop smoke-test

  installers:
    name: Release installers
    needs: [changes]
    # `main`, tags and manual runs always build the installers. A pull request
    # only does when the detector found a packaging input, so an ordinary PR
    # does not spend twenty runner-minutes rebuilding artifacts it cannot
    # change; `quality`, `tests` and `desktop-shell` still cover that change.
    if: >-
      github.event_name != 'pull_request'
      || needs.changes.outputs.packaging == 'true'
    uses: ./.github/workflows/build-installers.yml
    with:
      artifact-retention-days: 3
    secrets: inherit

  gate:
    name: CI gate
    if: always()
    needs: [changes, quality, tests, desktop-shell, installers]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every upstream job to succeed
        env:
          CHANGES: ${{ needs.changes.result }}
          QUALITY: ${{ needs.quality.result }}
          TESTS: ${{ needs.tests.result }}
          DESKTOP_SHELL: ${{ needs.desktop-shell.result }}
          INSTALLERS: ${{ needs.installers.result }}
          PACKAGING: ${{ needs.changes.outputs.packaging }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo "changes=$CHANGES quality=$QUALITY tests=$TESTS desktop-shell=$DESKTOP_SHELL installers=$INSTALLERS"
          for result in "$CHANGES" "$QUALITY" "$TESTS" "$DESKTOP_SHELL"; do
            if [[ "$result" != "success" ]]; then
              echo "A required job did not succeed: $result" >&2
              exit 1
            fi
          done
          case "$INSTALLERS" in
            success)
              ;;
            skipped)
              # The installer matrix may only be skipped on a pull request the
              # detector cleared; a skip anywhere else would let the gate pass
              # without the packaging steps it promises to require.
              if [[ "$EVENT" != "pull_request" || "$PACKAGING" == "true" ]]; then
                echo "The installer matrix was skipped even though it was required." >&2
                exit 1
              fi
              echo "Installer matrix deliberately skipped: no packaging input changed."
              ;;
            *)
              echo "The installer matrix did not succeed: $INSTALLERS" >&2
              exit 1
              ;;
          esac
