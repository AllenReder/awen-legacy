[package]
name = "awen-desktop"
version = "0.1.0-alpha.3"
description = "Awen desktop shell"
authors = ["Awen contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "awen_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
url = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
  "block2",
  "NSEvent",
  "NSApplication",
  "NSButton",
  "NSColor",
  "NSControl",
  "NSDockTile",
  "NSGraphics",
  "NSImage",
  "NSLayoutAnchor",
  "NSLayoutConstraint",
  "NSMenu",
  "NSMenuItem",
  "NSResponder",
  "NSUserInterfaceItemIdentification",
  "NSView",
  "NSVisualEffectView",
  "NSWindow",
  "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSError", "NSString"] }
raw-window-handle = "0.6"
