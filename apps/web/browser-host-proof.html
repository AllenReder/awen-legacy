<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Awen browser host proof</title>
    <style>
      body {
        margin: 0;
        background: #17202a;
        color: #f4f6f8;
        font: 14px system-ui;
      }
      aside {
        width: 325px;
        padding: 14px;
        box-sizing: border-box;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }
      p {
        line-height: 1.4;
      }
      button {
        display: block;
        width: 100%;
        margin: 7px 0;
        padding: 8px;
        cursor: pointer;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        max-height: 45vh;
        overflow-y: auto;
      }
    </style>
    <script type="module" src="/src/browser-host-proof.ts"></script>
  </head>
  <body>
    <aside>
      <h1>Native browser host proof</h1>
      <p>
        Two child webviews occupy the space to the right. Their controls run against those same
        native pages.
      </p>
      <button id="run">Run capability sequence</button>
      <button id="cancel">Check page A is still open</button>
      <button id="close">Confirm close of page A</button>
      <button id="reopen">Reopen page A</button>
      <pre id="log" role="status" aria-live="polite"></pre>
    </aside>
  </body>
</html>
